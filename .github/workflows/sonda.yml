name: Sonda BusOne Cotral

# Solo sul ramo "sonda": verifiche una tantum.
on:
  push:
    branches: [sonda]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Versioni delle librerie Wear OS su Google Maven
        run: |
          mkdir -p /tmp/sonda
          for g in androidx/wear/tiles androidx/wear/protolayout androidx/wear/compose androidx/wear/watchface androidx/wear com/google/android/gms androidx/concurrent; do
            echo "== $g"
            curl -s "https://dl.google.com/android/maven2/$g/group-index.xml" \
              | grep -E "<(tiles|tiles-tooling-preview|tiles-renderer|protolayout|protolayout-material3|protolayout-expression|compose-foundation|compose-material3|compose-navigation|compose-navigation3|compose-ui-tooling|watchface-complications-data-source-ktx|watchface-complications-data-source|wear|wear-tooling-preview|wear-ongoing|wear-phone-interactions|wear-remote-interactions|play-services-wearable|concurrent-futures|concurrent-futures-ktx) " \
              | sed -E 's/versions="([^"]*)"/\n   \1/' | awk 'NR%2==1{n=$0} NR%2==0{c=split($0,v,","); printf "%s ... %s\n", n, (c>6? v[c-5]","v[c-4]","v[c-3]","v[c-2]","v[c-1]","v[c] : $0)}'
          done | tee /tmp/sonda/versioni.txt
      - name: Immagini e profili Wear OS nell'SDK
        run: |
          mkdir -p /tmp/sonda
          S="$ANDROID_HOME/cmdline-tools/latest/bin"
          [ -x "$S/sdkmanager" ] || S="$(dirname "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)")"
          yes | "$S/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$S/sdkmanager" --list 2>/dev/null | grep -iE "wear|android-3[4-7];google_apis;x86_64" | sort -u > /tmp/sonda/immagini.txt || true
          "$S/avdmanager" list device -c > /tmp/sonda/dispositivi.txt 2>&1 || true
          ls "$ANDROID_HOME/platforms" > /tmp/sonda/piattaforme.txt 2>&1 || true
          cat /tmp/sonda/immagini.txt; grep -i wear /tmp/sonda/dispositivi.txt
      - name: Pubblica l'esito sul ramo sonda-esito
        if: always()
        run: |
          cd /tmp/sonda
          git init -q -b sonda-esito
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Esito della sonda $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-esito
