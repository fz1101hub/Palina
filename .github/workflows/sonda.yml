name: Sonda

# Solo sul ramo "sonda": verifiche una tantum.
on:
  push:
    branches: [sonda]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Versioni delle librerie (widget Wear OS 7, Live Updates, ongoing)
        run: |
          mkdir -p /tmp/sonda
          M=https://dl.google.com/android/maven2
          for a in androidx/glance/wear/wear androidx/glance/wear/wear-core androidx/glance/wear/wear-tooling-preview \
                   androidx/compose/remote/remote-creation-compose androidx/compose/remote/remote-core \
                   androidx/compose/remote/remote-creation androidx/compose/remote/remote-creation-core \
                   androidx/wear/compose/remote/remote-material3 androidx/core/core androidx/core/core-ktx \
                   androidx/wear/wear-ongoing androidx/wear/tiles/tiles androidx/wear/protolayout/protolayout \
                   androidx/wear/compose/compose-material3 androidx/compose/compose-bom androidx/activity/activity-compose; do
            v=$(curl -s "$M/$a/maven-metadata.xml" | grep -oE "<version>[^<]+</version>" | sed -E 's/<\/?version>//g' | tail -8 | tr '\n' ' ')
            echo "$a: $v"
          done | tee /tmp/sonda/versioni.txt
      - name: Sorgenti, POM e manifest delle librerie dei widget
        run: |
          M=https://dl.google.com/android/maven2
          ultima() { curl -s "$M/$1/maven-metadata.xml" | grep -oE "<latest>[^<]+</latest>" | sed -E 's/<\/?latest>//g'; }
          mkdir -p /tmp/sonda/sorgenti /tmp/sonda/pom /tmp/sonda/manifest /tmp/lavoro
          for a in androidx/glance/wear/wear androidx/glance/wear/wear-core \
                   androidx/compose/remote/remote-creation-compose androidx/compose/remote/remote-creation \
                   androidx/compose/remote/remote-creation-core androidx/compose/remote/remote-core \
                   androidx/wear/compose/remote/remote-material3 androidx/wear/wear-ongoing androidx/core/core; do
            v=$(ultima $a); n=$(basename $a)
            echo "$a -> $v"
            curl -sf -o "/tmp/sonda/pom/$n-$v.pom" "$M/$a/$v/$n-$v.pom" || echo "  niente pom"
            if curl -sf -o "/tmp/lavoro/$n.aar" "$M/$a/$v/$n-$v.aar"; then
              (cd /tmp/lavoro && rm -rf x && mkdir x && cd x && unzip -q ../$n.aar AndroidManifest.xml proguard.txt 2>/dev/null; \
                cp AndroidManifest.xml "/tmp/sonda/manifest/$n.xml" 2>/dev/null; cp proguard.txt "/tmp/sonda/manifest/$n-proguard.txt" 2>/dev/null) || true
            else
              curl -sf -o "/tmp/lavoro/$n.jar" "$M/$a/$v/$n-$v.jar" && echo "  jar"
            fi
            if curl -sf -o "/tmp/lavoro/$n-src.jar" "$M/$a/$v/$n-$v-sources.jar"; then
              mkdir -p "/tmp/sonda/sorgenti/$n" && (cd "/tmp/sonda/sorgenti/$n" && unzip -q -o "/tmp/lavoro/$n-src.jar")
            else
              echo "  niente sorgenti"
            fi
          done
          # di androidx.core bastano le notifiche
          find /tmp/sonda/sorgenti/core -type f ! -name "Notification*" -delete 2>/dev/null || true
          find /tmp/sonda/sorgenti -type d -empty -delete
          du -sh /tmp/sonda/sorgenti/*
      - name: Pubblica l'esito sul ramo sonda-esito
        if: always()
        run: |
          cd /tmp/sonda
          git init -q -b sonda-esito
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Esito della sonda $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-esito
