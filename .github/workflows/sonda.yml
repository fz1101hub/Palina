name: Sonda

# Solo sul ramo "sonda": verifiche una tantum.
on:
  push:
    branches: [sonda]

permissions:
  contents: write

jobs:
  versioni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Versioni delle librerie per il motore multipiattaforma
        run: |
          mkdir -p /tmp/sonda
          G=https://dl.google.com/android/maven2
          C=https://repo1.maven.org/maven2
          for a in $G/androidx/sqlite/sqlite $G/androidx/sqlite/sqlite-framework $G/androidx/sqlite/sqlite-bundled \
                   $C/org/jetbrains/kotlinx/kotlinx-coroutines-core $C/org/jetbrains/kotlinx/kotlinx-datetime \
                   $C/org/jetbrains/kotlin/kotlin-gradle-plugin; do
            v=$(curl -s "$a/maven-metadata.xml" | grep -oE "<version>[^<]+</version>" | sed -E 's/<\/?version>//g' | tail -10 | tr '\n' ' ')
            echo "${a##*/}: $v"
          done | tee /tmp/sonda/versioni.txt
          # le piattaforme di androidx.sqlite (serve watchOS?)
          ult=$(curl -s $G/androidx/sqlite/sqlite-framework/maven-metadata.xml | grep -oE "<release>[^<]+</release>" | sed -E 's/<\/?release>//g')
          curl -s "$G/androidx/sqlite/sqlite-framework/$ult/sqlite-framework-$ult.module" | grep -oE '"org.jetbrains.kotlin.native.target": "[a-z_0-9]+"' | sort -u | tee -a /tmp/sonda/versioni.txt
          cr=$(curl -s $C/org/jetbrains/kotlinx/kotlinx-coroutines-core/maven-metadata.xml | grep -oE "<release>[^<]+</release>" | sed -E 's/<\/?release>//g')
          curl -s "$C/org/jetbrains/kotlinx/kotlinx-coroutines-core/$cr/kotlinx-coroutines-core-$cr.module" | grep -oE '"org.jetbrains.kotlin.native.target": "[a-z_0-9]+"' | sort -u | tee -a /tmp/sonda/versioni.txt
      - uses: actions/upload-artifact@v4
        with:
          name: versioni
          path: /tmp/sonda

  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Xcode, simulatori e strumenti del Mac di GitHub
        run: |
          mkdir -p /tmp/sonda
          {
            sw_vers
            xcodebuild -version
            ls /Applications | grep -i xcode
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -iE "iphone 1[5-9]|iphone 2|watch" | head -30
            which xcodegen || echo "xcodegen assente"
            brew --version | head -1
            java -version 2>&1 | head -1
          } 2>&1 | tee /tmp/sonda/mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: /tmp/sonda

  esito:
    needs: [versioni, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/esito
      - name: Risultati sul ramo sonda-esito
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/esito
          find . -type f | sort
          git init -q -b sonda-esito
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sonda ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sonda-esito
