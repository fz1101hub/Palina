name: Sonda BusOne Cotral

# Solo sul ramo "sonda": verifica una tantum dei flussi BusOne per Cotral.
on:
  push:
    branches: [sonda]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sonda
        run: |
          pip install --quiet gtfs-realtime-bindings
          python3 strumenti/sonda_scambi.py /tmp/sonda || true
          python3 strumenti/sonda_roma.py /tmp/sonda || true
          python3 strumenti/sonda_busone.py /tmp/sonda
      - name: Pubblica l'esito sul ramo sonda-esito
        if: always()
        run: |
          cd /tmp/sonda
          git init -q -b sonda-esito
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Esito della sonda BusOne $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-esito
