name: Ultime versioni
on:
  push:
    branches: [versioni]
permissions:
  contents: write
jobs:
  versioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cerca le ultime versioni
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
            AM=$(dirname $SM)/avdmanager
            echo "== immagini di sistema 26 e 34+ =="
            $SM --list 2>/dev/null | grep -E "system-images;android-(26|3[4-9])" | sed 's/  */ /g' | sort -u
            echo "== emulatore e platform-tools =="
            $SM --list 2>/dev/null | grep -E "^ *(emulator|platform-tools) " | sed 's/  */ /g' | sort -u
            echo "== dispositivi avd =="
            $AM list device -c 2>/dev/null | tr '\n' ' '
            echo; echo "== kvm =="; ls -l /dev/kvm 2>&1; nproc; free -g | head -2
          } > /tmp/versioni.txt 2>&1
          mkdir -p /tmp/esito && cp /tmp/versioni.txt /tmp/esito/
          cd /tmp/esito && git init -q -b risultati-versioni-2 && git config user.name gh && git config user.email gh@users.noreply.github.com
          git add -A && git commit -q -m versioni && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" risultati-versioni-2
