name: Ultime versioni
on:
  push:
    branches: [versioni]
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.0
      - name: Genera il wrapper di Gradle 9.9.0
        run: |
          mkdir -p /tmp/w && cd /tmp/w
          echo 'rootProject.name = "w"' > settings.gradle.kts
          gradle --version
          gradle wrapper --gradle-version 9.9.0 --distribution-type bin --gradle-distribution-sha256-sum 0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a
          rm -rf settings.gradle.kts .gradle
          gradle --version > versione.txt 2>&1
          git init -q -b wrapper-gradle && git config user.name gh && git config user.email gh@users.noreply.github.com
          git add -A && git commit -q -m wrapper && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wrapper-gradle
