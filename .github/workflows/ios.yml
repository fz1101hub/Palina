name: App iOS

# L'app per iPhone (SwiftUI) sopra il motore Kotlin condiviso con Android.
# Gira sui push del ramo "ios" e, quando ci saranno, su quelli di main che
# toccano il motore o l'app iOS.
on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Android con il motore: deve compilare e passare i test come prima
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Compila l'app Android e l'orologio con il motore, test compresi
        run: |
          set -o pipefail
          mkdir -p /tmp/esito
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :orologio:assembleDebug :orologio:testDebugUnitTest \
            2>&1 | tee /tmp/esito/android.log
      - name: Riassunto
        if: always()
        run: |
          mkdir -p /tmp/esito
          grep -E "^e: |^w: .*motore|BUILD|FAILED|tests completed" /tmp/esito/android.log > /tmp/esito/android-errori.txt || true
          find . -path "*/build/test-results/*" -name "*.xml" -exec cp {} /tmp/esito/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: /tmp/esito

  # 1b. L'app Android con il motore sui telefoni simulati (le stesse prove di main)
  android-emulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            immagine: "system-images;android-26;google_apis;x86_64"
          - api: 37
            immagine: "system-images;android-37.0;google_apis;x86_64"
          # l'app Wear OS usa il ponte del motore: anche gli orologi
          - api: wear34
            immagine: "system-images;android-34;android-wear;x86_64"
            modulo: orologio
            dispositivo: wearos_small_round
          - api: wear37
            immagine: "system-images;android-37.0;android-wear-signed;x86_64"
            modulo: orologio
            dispositivo: wearos_large_round
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Orario incluso (dall'ultimo APK Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apk app/src/main/assets
          gh release download ultima -p app-release.apk -D /tmp/apk
          unzip -o -j /tmp/apk/app-release.apk assets/orario.db assets/orario-incluso.txt assets/reti.db assets/reti-incluse.txt -d app/src/main/assets
      - name: Accelerazione dell'emulatore (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prova sull'emulatore (${{ matrix.api }})
        env:
          MODULO: ${{ matrix.modulo || 'app' }}
          DISPOSITIVO: ${{ matrix.dispositivo || 'pixel_7' }}
        run: bash strumenti/prova-emulatore.sh "${{ matrix.immagine }}" risultati
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulatore-${{ matrix.api }}
          path: risultati
          if-no-files-found: ignore

  # 2. iPhone: motore come XCFramework, progetto XcodeGen, simulatore, IPA
  iphone:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Motore per iPhone e Apple Watch (XCFramework)
        run: |
          set -o pipefail
          mkdir -p /tmp/esito
          ./gradlew --no-daemon --console=plain :motore:assembleMotoreDebugXCFramework 2>&1 | tee /tmp/esito/motore.log
          ls -R motore/build/XCFrameworks/debug | head -40 | tee -a /tmp/esito/motore.log

      - name: Orario incluso (dall'ultimo APK Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apk
          gh release download ultima -p app-release.apk -D /tmp/apk
          unzip -o -j /tmp/apk/app-release.apk assets/orario.db assets/reti.db assets/orario-incluso.txt assets/reti-incluse.txt -d ios/Risorse
          # l'orario per l'aggiornamento dall'iPhone: si deve aprire con NSData.decompressed(.zlib)
          python3 strumenti/orari_iphone.py ios/Risorse /tmp/iphone | tee -a /tmp/esito/risorse.txt
          swift strumenti/prova-deflate.swift /tmp/iphone/orario.db.deflate ios/Risorse/orario.db | tee -a /tmp/esito/risorse.txt
          ls -la ios/Risorse | tee /tmp/esito/risorse.txt

      - name: Progetto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compila per il simulatore
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Palina.xcodeproj -scheme Palina -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/esito/xcode-simulatore.log | grep -E "error:|warning: .*swift|BUILD" || true
          test -f build/dd/Build/Products/Debug-iphonesimulator/Palina.app/Palina

      - name: Prova sul simulatore con le schermate
        run: |
          set -x
          mkdir -p /tmp/esito/schermate
          dispositivo=$(xcrun simctl create prova "iPhone 17" 2>/dev/null || xcrun simctl create prova "iPhone 16")
          xcrun simctl boot "$dispositivo"
          xcrun simctl bootstatus "$dispositivo" -b
          xcrun simctl install "$dispositivo" ios/build/dd/Build/Products/Debug-iphonesimulator/Palina.app
          # 1. Home vicino a piazza Venezia
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826
          sleep 12
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-01-home.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 2. Una fermata di Roma (piazza Venezia)
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri fermata:70078
          sleep 8
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-02-fermata.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 3. La stazione di scambio Basilica San Paolo (Metro B e Metromare)
          id=$(sqlite3 ios/Risorse/reti.db "SELECT id FROM fermate WHERE id LIKE 'F:%' AND nome LIKE '%San Paolo%' LIMIT 1")
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "fermata:$id"
          sleep 8
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-03-scambio.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 4. Home con due preferite (una vicina a piazza Venezia, una a Termini)
          termini=$(sqlite3 ios/Risorse/orario.db "SELECT id FROM fermate WHERE nome LIKE '%Termini%' LIMIT 1")
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -provaPreferiti "70078,$termini"
          sleep 14
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-04-preferite.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 5. La linea 64 con la mappa e le vetture
          l64=$(sqlite3 ios/Risorse/orario.db "SELECT id FROM linee WHERE nome = '64' LIMIT 1")
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "linea:$l64" -direzione 0
          sleep 16
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-05-linea.png
          # la prima mappa sul simulatore appena creato puo' metterci di piu'
          sleep 20
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-05b-linea-dopo.png
          xcrun simctl spawn "$dispositivo" log show --last 1m --predicate 'process == "Palina"' --style compact > /tmp/esito/log-linea.txt 2>&1 || true
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 6. Una linea Cotral (bus col GPS di BusOne): la prima dell'orario delle reti
          cotral=$(sqlite3 ios/Risorse/reti.db "SELECT linea FROM percorsi WHERE linea LIKE 'C:%' ORDER BY linea LIMIT 1")
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "linea:$cotral"
          sleep 16
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-06-linea-cotral.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 6b. Un treno della Roma-Lido da Basilica San Paolo: tutte le sue fermate
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "fermata:$id" -apriPrimoTreno YES
          sleep 20
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-07-treno.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 6c. Lo stesso da Lido Centro (come la prova Android): per confronto
          lido=$(sqlite3 ios/Risorse/reti.db "SELECT id FROM fermate WHERE id LIKE 'F:%' AND nome LIKE '%Lido Centro%' LIMIT 1")
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "fermata:$lido" -apriPrimoTreno YES
          sleep 20
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-07b-treno-lido.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 8. Tragitti da piazza Venezia a Termini (Transitous), poi il primo con la mappa
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "tragitto:$termini"
          sleep 20
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-08-tragitti.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "tragitto:$termini" -apriPrimoTragitto YES
          sleep 28
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-09-tragitto.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 9. La scelta dell'arrivo con un indirizzo cercato
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "luogo:Colosseo"
          sleep 12
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-10-luogo.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          # 10. Le impostazioni, con l'aspetto scuro
          xcrun simctl launch "$dispositivo" it.palinaroma -posizione 41.8958,12.4826 -apri "impostazioni:1" -aspetto SCURO
          sleep 8
          xcrun simctl io "$dispositivo" screenshot /tmp/esito/schermate/ios-11-impostazioni.png
          xcrun simctl terminate "$dispositivo" it.palinaroma
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i palina > /tmp/esito/crash.txt || true
          # 7. Apple Watch con il tabellone di esempio del motore (senza iPhone collegato)
          orologio=$(xcrun simctl create prova-watch "Apple Watch Series 11 (46mm)" 2>/dev/null || xcrun simctl create prova-watch "Apple Watch Series 10 (46mm)")
          xcrun simctl boot "$orologio"
          xcrun simctl bootstatus "$orologio" -b
          ls ios/build/dd/Build/Products/ | tee -a /tmp/esito/prodotti.txt
          app_watch=$(find ios/build/dd/Build/Products/Debug-watchsimulator -maxdepth 1 -name "PalinaWatch.app" | head -1)
          xcrun simctl install "$orologio" "$app_watch"
          xcrun simctl launch "$orologio" it.palinaroma.watchkitapp -provaEsempio YES
          sleep 10
          xcrun simctl io "$orologio" screenshot /tmp/esito/schermate/watch-01-tabellone.png
          xcrun simctl terminate "$orologio" it.palinaroma.watchkitapp
          xcrun simctl launch "$orologio" it.palinaroma.watchkitapp -provaEsempio YES -provaTreno YES
          sleep 8
          xcrun simctl io "$orologio" screenshot /tmp/esito/schermate/watch-02-treno.png
          xcrun simctl spawn "$dispositivo" log show --last 3m --predicate 'process == "Palina"' --style compact > /tmp/esito/log-app.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i palina > /tmp/esito/crash.txt || true

      - name: IPA non firmato (per AltStore o Sideloadly)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Palina.xcodeproj -scheme Palina -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/esito/xcode-iphone.log | grep -E "error:|BUILD" || true
          mkdir -p /tmp/ipa/Payload
          cp -R build/dd/Build/Products/Debug-iphoneos/Palina.app /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qr PalinaRoma-iOS.ipa Payload)
          test -f /tmp/ipa/Payload/Palina.app/Palina
          ls -la /tmp/ipa/PalinaRoma-iOS.ipa | tee /tmp/esito/ipa.txt

      - name: IPA nella release "ios-prova"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-prova > /dev/null 2>&1 || gh release create ios-prova --prerelease --target "$GITHUB_SHA" \
            --title "App iOS (prova)" --notes "App per iPhone non firmata, da installare con AltStore o Sideloadly. Compilata dal ramo ios."
          gh release edit ios-prova --notes "App per iPhone non firmata, da installare con AltStore o Sideloadly. Compilata dal commit $GITHUB_SHA del ramo ios."
          gh release upload ios-prova /tmp/ipa/PalinaRoma-iOS.ipa --clobber

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iphone
          path: /tmp/esito

  # 3. Risultati sul ramo ios-esito (si leggono senza scaricare gli artifact)
  risultati:
    needs: [android, android-emulatore, iphone]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/esito
      - name: Pubblica i risultati
        env:
          GH_TOKEN: ${{ github.token }}
          ESITO_ANDROID: ${{ needs.android.result }}
          ESITO_IPHONE: ${{ needs.iphone.result }}
          ESITO_EMULATORE: ${{ needs.android-emulatore.result }}
        run: |
          cd /tmp/esito
          { echo "commit: $GITHUB_SHA"; echo "android: $ESITO_ANDROID"; echo "android sugli emulatori: $ESITO_EMULATORE"; echo "iphone: $ESITO_IPHONE"; } > ESITO.txt
          for r in emulatore-*/riassunto.txt; do [ -f "$r" ] && { echo "== $r"; cat "$r"; } >> ESITO.txt; done
          for f in iphone/motore.log android/android.log; do
            [ -f "$f" ] && { echo "== $f"; grep -E "^e: |error:|FAILED|BUILD" "$f" | head -60; } >> ESITO.txt
          done
          [ -f iphone/xcode-simulatore.log ] && { echo "== xcode"; grep -E "error:" iphone/xcode-simulatore.log | head -40; } >> ESITO.txt
          find . -name "*.log" -size +2M -delete
          git init -q -b ios-esito
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "App iOS $GITHUB_SHA: android $ESITO_ANDROID, iphone $ESITO_IPHONE"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-esito
