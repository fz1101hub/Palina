name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ogni lunedi' notte: APK con l'orario di Roma Mobilita' della settimana
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  actions: write # solo per tenere attiva la compilazione settimanale (ultimo passo)

concurrency:
  group: compila
  cancel-in-progress: true

jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Scarica l'orario di Roma Mobilita' (o la copia del Mobility Database) e lo
      # trasforma nel database incluso nell'APK. Se non riesce, l'APK si compila
      # lo stesso e l'app scarichera' l'orario al primo avvio.
      - name: Prepara l'orario da includere nell'APK
        continue-on-error: true
        run: |
          set -eo pipefail
          mkdir -p /tmp/orario
          fonte=""
          for url in \
            https://romamobilita.it/sites/default/files/rome_static_gtfs.zip \
            https://files.mobilitydatabase.org/mdb-1294/latest.zip; do
            if curl -fsSL --retry 2 --max-time 600 -A "PalinaRoma-CI (+https://github.com/fz1101hub/Palina)" \
                 -o /tmp/orario/gtfs.zip "$url" && unzip -tq /tmp/orario/gtfs.zip > /dev/null; then
              fonte="$url"
              break
            fi
            echo "orario incluso: $url non raggiungibile" | tee -a orario.log
          done
          test -n "$fonte"
          echo "orario incluso: fonte $fonte, $(du -h /tmp/orario/gtfs.zip | cut -f1)" | tee -a orario.log
          ORARIO_GTFS=/tmp/orario/gtfs.zip ORARIO_SQL=/tmp/orario/orario.sql \
            ./gradlew --no-daemon --console=plain testDebugUnitTest --tests it.palinaroma.dati.GeneraOrarioIncluso --rerun \
            2>&1 | tee -a orario.log
          python3 strumenti/crea_orario.py /tmp/orario/orario.sql app/build/orario-incluso | tee -a orario.log
          rm -f /tmp/orario/orario.sql

      # La password della firma arriva solo a questo passo: gli altri (e le azioni
      # di terzi) non la vedono. Agli altri passi dice solo se c'era.
      - name: Test e compilazione
        id: compila
        env:
          FIRMA_PASSWORD: ${{ secrets.FIRMA_PASSWORD }}
        run: |
          set -o pipefail
          echo "firma=${FIRMA_PASSWORD:+presente}" >> "$GITHUB_OUTPUT"
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease 2>&1 | tee compilazione.log

      # Salva l'esito nel ramo "esito", leggibile senza accedere a GitHub
      - name: Salva l'esito della compilazione
        if: always()
        env:
          FIRMA: ${{ steps.compila.outputs.firma }}
        run: |
          esito="${{ job.status }}"
          mkdir -p /tmp/esito
          { echo "commit: $GITHUB_SHA"; echo "esito: $esito"; echo "firma: $FIRMA"; grep "^orario incluso" orario.log || echo "orario incluso: passo non eseguito"; } > /tmp/esito/ESITO.txt
          { grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|tests completed" compilazione.log | head -300; grep -A12 "What went wrong" compilazione.log | head -120; } > /tmp/esito/errori.txt || true
          tail -400 compilazione.log > /tmp/esito/coda.log || true
          tail -200 orario.log > /tmp/esito/orario.log 2>/dev/null || true
          find app/build/test-results -name "*.xml" -exec cp {} /tmp/esito/ \; 2>/dev/null || true
          cd /tmp/esito
          git init -q -b esito
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Esito compilazione $GITHUB_SHA: $esito"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" esito

      - uses: actions/upload-artifact@v4
        with:
          name: palina-roma-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Sposta l'etichetta "ultima" su questo commit
        run: |
          git tag -f ultima
          git push -f origin refs/tags/ultima

      # Con lo strumento "gh" gia' presente su GitHub, senza azioni di terzi
      - name: Pubblica l'APK nella release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIRMA: ${{ steps.compila.outputs.firma }}
        run: |
          note="Compilata dal commit $GITHUB_SHA. Dal telefono scarica app-release.apk e installala."
          orario=$(grep -m1 "^orario incluso: si" orario.log 2>/dev/null | grep -o "[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" | head -1 || true)
          if [ -n "$orario" ]; then
            note="$note Contiene l'orario di Roma Mobilità del $orario."
          else
            note="$note Senza orario incluso: l'app lo scarica al primo avvio."
          fi
          if [ -z "$FIRMA" ]; then
            note="$note Versione di prova: per aggiornarla disinstalla prima quella vecchia (perderai i preferiti)."
          fi
          gh release view ultima > /dev/null 2>&1 || gh release create ultima --title "Ultima versione" --notes "$note"
          gh release edit ultima --title "Ultima versione" --notes "$note" --latest
          gh release upload ultima app/build/outputs/apk/release/app-release.apk --clobber

      # GitHub sospende le compilazioni programmate dopo 60 giorni senza modifiche
      # al repository: riattivare il flusso di lavoro fa ripartire il conto.
      - name: Tiene attiva la compilazione settimanale
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compila.yml/enable"
