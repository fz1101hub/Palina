# Progetto Xcode dell'app per iPhone, generato con XcodeGen (xcodegen generate).
# Il motore (dati, fonti, orario, cosa mostrare) e' il modulo Kotlin "motore",
# compilato come Motore.xcframework; qui ci sono solo le schermate SwiftUI.
name: Palina
options:
  bundleIdPrefix: it.palinaroma
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # i testi sono in italiano; le traduzioni (en, fr, es, de, pt) vengono dal motore
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.26"
    CURRENT_PROJECT_VERSION: "27"
targets:
  Palina:
    type: application
    platform: iOS
    sources:
      - path: Palina
      - path: Condiviso/Colore.swift
      - path: Condiviso/Motore
      - path: Condiviso/Segui
      - path: Condiviso/Widget
      - path: Risorse
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../motore/build/XCFrameworks/debug/Motore.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      # l'app per Apple Watch va dentro quella per iPhone
      - target: PalinaWatch
      # la Live Activity di "Segui" e i widget della schermata Home
      - target: PalinaWidget
        embed: true
    # il gruppo condiviso con i widget (come per le complicazioni dell'Apple Watch)
    entitlements:
      path: Palina/Palina.entitlements
      properties:
        com.apple.security.application-groups: [group.it.palinaroma]
    info:
      path: Palina/Info.plist
      properties:
        # palina://... dai widget e dai pulsanti della Live Activity
        CFBundleURLTypes:
          - CFBundleURLName: it.palinaroma
            CFBundleURLSchemes: [palina]
        # i widget si aggiornano anche con Palina chiusa, quando iOS lo permette
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [it.palinaroma.widget]
        CFBundleDisplayName: Palina
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # anche per iPad: tutte le rotazioni (e Split View)
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: "Palina usa la tua posizione per mostrarti le fermate vicine e per calcolare i tragitti."
        # le cifre a punti delle paline (Doto, SIL Open Font License)
        UIAppFonts: [Doto-Black.ttf]
        # "Segui": il conto alla rovescia sulla schermata di blocco e nella Dynamic Island
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.palinaroma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-lsqlite3", "-lc++"]
        # il motore per il simulatore c'e' solo per i Mac Apple Silicon (arm64)
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # L'app per Apple Watch: mostra il tabellone che le calcola l'iPhone (come per Wear OS)
  PalinaWatch:
    type: application
    platform: watchOS
    sources:
      - path: PalinaWatch
      - path: Condiviso/Colore.swift
      - path: Condiviso/Motore
      - path: Condiviso/Orologio
    dependencies:
      - framework: ../motore/build/XCFrameworks/debug/Motore.xcframework
        embed: false
      # complicazioni e Smart Stack
      - target: PalinaWatchWidget
        embed: true
    entitlements:
      path: PalinaWatch/PalinaWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.it.palinaroma]
    info:
      path: PalinaWatch/Info.plist
      properties:
        CFBundleDisplayName: Palina
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.palinaroma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.palinaroma.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # La Live Activity di "Segui" sull'iPhone (anche nello Smart Stack dell'Apple Watch)
  PalinaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PalinaWidget
      - path: Condiviso/Colore.swift
      - path: Condiviso/Segui
      - path: Condiviso/Widget
      # le cifre a punti delle paline anche nei widget e sulla schermata di blocco
      - path: Palina/Doto-Black.ttf
        buildPhase: resources
    entitlements:
      path: PalinaWidget/PalinaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.it.palinaroma]
    info:
      path: PalinaWidget/Info.plist
      properties:
        CFBundleDisplayName: Palina
        UIAppFonts: [Doto-Black.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.palinaroma.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  # Le complicazioni dell'Apple Watch: la prossima linea alla fermata preferita piu' vicina
  PalinaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PalinaWatchWidget
      - path: Condiviso/Colore.swift
      - path: Condiviso/Orologio
    entitlements:
      path: PalinaWatchWidget/PalinaWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.it.palinaroma]
    info:
      path: PalinaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Palina
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.palinaroma.watchkitapp.widget
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
